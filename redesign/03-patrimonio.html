<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Patrimônio</title>
<link rel="stylesheet" href="_radar.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, fmt0, tok, skTable } = Radar;

/* nome, tipo, inicial, atual, data, depreciação a.a., meta vinculada */
const A = [
  ['Tesouro Selic 2029','investimento', 12000, 15400, '2024-03-10', null, 'Reserva de emergência'],
  ['CDB Banco X',       'investimento', 38000, 42300, '2023-08-01', null, 'Aposentadoria'],
  ['Conta corrente',    'caixa',         3250,  3250, '2026-08-01', null, null],
  ['Fiat Argo 2021',    'bem',          62000, 41200, '2021-11-20', 12,   null],
  ['Notebook Dell',     'bem',           4950,  3712, '2025-02-14', 20,   null],
];
const TIPO = { investimento:'investimento', caixa:'caixa', bem:'bem' };
const soma = t => A.filter(a => a[1] === t).reduce((s,a) => s + a[3], 0);
const INV = soma('investimento'), CX = soma('caixa'), BEM = soma('bem');
const TOTAL = INV + CX + BEM;

const dados = `
<div class="kpi-grid">
  <div class="kpi hero"><span class="kpi-lbl">Patrimônio total</span>
    <span class="kpi-val">${fmt(TOTAL)}</span>
    <span class="kpi-sub">+${fmt0(1193)} nesta semana · 5 ativos</span></div>
  <div class="kpi"><span class="kpi-lbl">Investimentos</span><span class="kpi-val">${fmt(INV)}</span>
    <span class="kpi-sub">${Math.round(INV/TOTAL*100)}% do total</span>
    <a class="kpi-link" href="03-metas.html">2 vinculados a metas →</a></div>
  <div class="kpi"><span class="kpi-lbl">Caixa</span><span class="kpi-val">${fmt(CX)}</span>
    <span class="kpi-sub">abertura do fluxo de agosto</span>
    <a class="kpi-link" href="03-calendario.html">Ver o fluxo →</a></div>
  <div class="kpi"><span class="kpi-lbl">Bens</span><span class="kpi-val">${fmt(BEM)}</span>
    <span class="kpi-sub">já depreciados</span></div>
</div>

<div class="grid2">
  <div class="card"><div class="card-head"><span class="card-ttl">Composição</span></div>
  <p class="card-sub">A proporção entre o que rende, o que está parado em conta e o que só perde valor.</p>
    <div class="chart-box"><canvas id="comp"></canvas></div>
    <ul class="legend" id="leg"></ul></div>
  <div class="card"><div class="card-head"><span class="card-ttl">Evolução · 6 meses</span></div>
  <p class="card-sub">A soma de tudo, mês a mês.</p>
    <div class="chart-box tall"><canvas id="evo"></canvas></div></div>
</div>

<div class="card grow">
  <div class="card-head"><span class="card-ttl">Ativos</span><span class="sp"></span>
    <button class="btn btn-primary btn-sm" data-open="modal-ativo">+ Novo ativo</button></div>
  <p class="card-sub">Use o + para registrar um aporte e o ✎ para atualizar o valor atual. Bem com taxa de depreciação se atualiza sozinho.</p>
  <div class="table-wrapper">
    <table class="data">
      <thead><tr><th>Ativo</th><th>Tipo</th><th class="num">Valor inicial</th><th class="num">Valor atual</th>
        <th>Meta vinculada</th><th class="num">Variação</th><th></th></tr></thead>
      <tbody>${A.map(a => {
        const d = a[3] - a[2], p = d / a[2] * 100;
        return `<tr>
          <td><b style="font-weight:500">${a[0]}</b>
            <div class="form-hint">desde ${a[4].split('-').reverse().join('/')}${a[5] ? ` · deprecia ${a[5]}% a.a.` : ''}</div></td>
          <td><span class="tag">${TIPO[a[1]]}</span></td>
          <td class="num">${fmt(a[2])}</td>
          <td class="num">${fmt(a[3])}</td>
          <td>${a[6] ? a[6] : '<span style="color:var(--text-3)">—</span>'}</td>
          <td class="num ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : '−'}${Math.abs(p).toFixed(1)}%</td>
          <td><div class="row-act">
            <button class="icon-btn" title="Aporte" data-open="modal-aporte-ativo">+</button>
            <button class="icon-btn" title="Editar" data-open="modal-ativo">✎</button>
            <button class="icon-btn" title="Excluir">✕</button></div></td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${fmt(TOTAL)}</td><td colspan="3"></td></tr></tfoot>
    </table>
  </div>
  <p class="form-hint" style="margin-top:10px">Bem com taxa de depreciação tem o valor atual recalculado
    pelo tempo desde a aquisição. Aporte em ativo vinculado credita a meta junto, numa escrita só.</p>
</div>`;

const vazio = `
<div class="card">
  <div class="empty">
    <div class="glyph">⌂</div>
    <h3>Nenhum ativo cadastrado</h3>
    <p>Patrimônio é o que você tem: investimento, caixa e bem. O saldo em caixa aqui é o mesmo
       que abre o Fluxo de Caixa, e um investimento pode ser vinculado a uma meta.</p>
    <button class="btn btn-primary" data-open="modal-ativo">Cadastrar ativo</button>
  </div>
</div>`;

const carregando = `${Radar.skKpis(4)}
<div class="grid2">${Radar.skRing()}${Radar.skChart(260)}</div>${skTable(5,7)}`;

const modals = `
<div class="modal" id="modal-ativo" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Editar ativo</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Nome</label><input class="form-input" value="Tesouro Selic 2029"></div></div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Tipo</label>
          <select class="form-input"><option>Investimento</option><option>Caixa</option><option>Bem</option></select></div>
        <div class="form-col"><label class="form-label">Data de aquisição</label>
          <input type="date" class="form-input" value="2024-03-10"></div>
      </div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Valor inicial</label><input type="number" class="form-input" value="12000"></div>
        <div class="form-col"><label class="form-label">Valor atual</label><input type="number" class="form-input" value="15400"></div>
      </div>
      <div class="form-row" id="deprec-row">
        <div class="form-col" style="flex:1 1 100%"><label class="form-label">Depreciação (% ao ano)</label>
          <input type="number" class="form-input" placeholder="12">
          <span class="form-hint">Aparece só quando o tipo é "Bem".</span></div>
      </div>
      <div class="form-row" id="ativo-meta-row">
        <div class="form-col" style="flex:1 1 100%"><label class="form-label">Meta vinculada</label>
          <select class="form-input"><option>Reserva de emergência</option><option>Aposentadoria</option><option>— nenhuma —</option></select>
          <span class="form-hint">Aparece só quando o tipo é "Investimento". Todo aporte neste ativo credita a meta.</span></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Observação</label><textarea class="form-input" rows="2"></textarea></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-danger">Excluir</button><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar</button></div>
  </div>
</div>

<div class="modal" id="modal-aporte-ativo" hidden>
  <div class="modal-box" style="width:min(430px,94vw)">
    <div class="modal-head"><h2>Aporte · Tesouro Selic 2029</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-col"><label class="form-label">Valor</label><input type="number" class="form-input" value="1200"></div>
        <div class="form-col"><label class="form-label">Data</label><input type="date" class="form-input" value="2026-08-12"></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Observação</label><input class="form-input" placeholder="opcional"></div></div>
      <p class="form-hint">Este ativo está vinculado a <b>Reserva de emergência</b> —
        o aporte soma no ativo e credita a meta na mesma operação.</p>
    </div>
    <div class="modal-foot"><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar aporte</button></div>
  </div>
</div>`;

let cs = [];
function onRender(estado, root) {
  cs.forEach(c => c.destroy()); cs = [];
  if (estado !== 'dados') return;

  const cores = [tok('--c5'), tok('--c4'), tok('--c3')];
  const labels = ['Investimentos','Caixa','Bens'], vals = [INV, CX, BEM];
  root.querySelector('#leg').innerHTML = labels.map((n,i) =>
    `<li><span class="k" style="background:${cores[i]}"></span><span class="nm">${n}</span>
     <span class="pc">${Math.round(vals[i]/TOTAL*100)}%</span><span class="vl">${fmt0(vals[i])}</span></li>`).join('');

  cs.push(new Chart(root.querySelector('#comp'), {
    type:'doughnut',
    data:{labels, datasets:[{ data:vals, backgroundColor:cores, borderColor:tok('--surface'),
      borderWidth:3, borderRadius:7, spacing:2, hoverOffset:9 }]},
    options:{ ...Radar.chartBase({ scales:null }), cutout:'72%' }
  }));

  cs.push(new Chart(root.querySelector('#evo'), {
    type:'line',
    data:{labels:['março','abril','maio','junho','julho','agosto'],
      datasets:[ Radar.linha('Patrimônio', [94200,95800,97400,99100,100600,TOTAL], tok('--c5')) ]},
    options: Radar.chartBase()
  }));
}

mount({ tab:'patrimonio', title:'Patrimônio',
  intro:"Tudo que você tem: investimento, dinheiro em conta e bens. <b>Atualize o valor atual de vez em quando</b> — é o que mantém o total e a curva de evolução certos.", states:{dados, vazio, carregando}, modals, onRender });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/patrimonio.js', [
  ['renderPatrimonio', 'Ponto de entrada da aba', 'Tela inteira'],
  ['pat-total / pat-total-sub', 'Patrimônio somado e variação', 'KPI principal'],
  ['pat-investimentos', 'Soma dos ativos de investimento', 'KPI "Investimentos"'],
  ['pat-caixa', 'Soma do que é caixa', 'KPI "Caixa"'],
  ['pat-bens', 'Soma dos bens, já depreciados', 'KPI "Bens"'],
  ['_renderAtivos', 'Tabela de ativos com valor inicial, atual e variação', 'Card "Ativos"'],
  ['_valorDepreciado', 'Recalcula o bem pela taxa e pelo tempo', 'Coluna Valor atual + nota "deprecia X% a.a."'],
  ['btn-novo-ativo', 'Abre o modal em branco', 'Botão "+ Novo ativo"'],
  ['_openAtivoModal', 'Abre o modal preenchido', 'Botão ✎ da linha'],
  ['ativo-nome / tipo / valor-inicial / valor-atual / data / obs', 'Campos do formulário', 'Modal "Editar ativo"'],
  ['deprec-row', 'Campo de depreciação só para tipo "Bem"', 'Linha condicional do modal'],
  ['_populateMetaSelect / ativo-meta-row', 'Vínculo com meta, só para investimento', 'Linha condicional do modal'],
  ['_salvarAtivo', 'Grava o ativo', 'Botão "Salvar"'],
  ['modal-aporte-ativo', 'Registra aporte no ativo', 'Botão + da linha'],
  ['addAporteToAsset (js/db.js:372)', 'Aporte soma no ativo e credita a meta vinculada', 'Nota dentro do modal de aporte'],
  ['excluir (confirm nativo)', 'Remove o ativo', 'Botão ✕ da linha'],
  ['NOVO · composição e evolução', 'Dois gráficos que a aba NÃO tem hoje. O ROTEIRO marca Patrimônio como "não mexer" — proposta separada, recuse sem custo para o resto da tela', 'Cards "Composição" e "Evolução"'],
]));
</script>
</body>
</html>

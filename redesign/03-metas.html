<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Metas</title>
<link rel="stylesheet" href="_radar.css">
<style>
  .metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .meta{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px}
  .meta.ok{border-color:var(--receita)}
  .meta h3{font-size:.98rem;font-weight:600;margin-bottom:2px}
  .meta .tipo{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
  .meta .vals{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
  .meta .atual{font-family:var(--font-num);font-size:1.22rem;font-weight:500}
  .meta .alvo{font-family:var(--font-num);font-size:.8rem;color:var(--text-3)}
  .meta .foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:.75rem;color:var(--text-2)}
  .meta .acts{display:flex;gap:6px;margin-top:12px}
  .mobile .metas{grid-template-columns:1fr}
</style>
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, fmt0, skTable } = Radar;

/* nome, tipo, atual, alvo, prazo, vinculada a ativo */
const METAS = [
  ['Reserva de emergência','reserva', 15000, 30000, '12/2027', 'Tesouro Selic 2029'],
  ['Viagem · Chile',        'viagem',  4200,  9000, '06/2027', null],
  ['Notebook novo',         'compra',  6500,  6500, '09/2026', null],
  ['Aposentadoria',         'longo',  42300, 500000,'12/2045', 'CDB Banco X'],
];

const card = ([n,t,atual,alvo,prazo,ativo]) => {
  const p = atual / alvo * 100;
  const done = atual >= alvo;
  return `
  <div class="meta ${done ? 'ok' : ''}">
    <div class="tipo">${t}</div>
    <h3>${n}</h3>
    <div class="vals"><span class="atual ${done ? 'up' : ''}">${fmt(atual)}</span>
      <span class="alvo">de ${fmt(alvo)}</span></div>
    <div class="bar ${done ? 'ok' : p >= 80 ? 'warn' : ''}"><i style="width:${Math.min(p,100)}%"></i></div>
    <div class="foot"><span>${Math.round(p)}%</span>
      <span>${done ? 'concluída' : 'faltam ' + fmt0(alvo - atual)}</span>
      <span>prazo ${prazo}</span></div>
    ${ativo ? `<div class="foot" style="border-top:1px solid var(--border);padding-top:8px">
      <span class="form-hint">Recebe os aportes de <b>${ativo}</b></span></div>` : ''}
    <div class="acts">
      <button class="btn btn-ghost btn-sm" data-open="modal-aporte">+ Aporte</button>
      <button class="btn btn-ghost btn-sm" data-open="modal-meta">Editar</button>
      <span style="flex:1 1 auto"></span>
      <button class="icon-btn" title="Excluir">✕</button>
    </div>
  </div>`;
};

const TOT = METAS.reduce((s,m)=>s+m[2],0), ALVO = METAS.reduce((s,m)=>s+m[3],0);

const dados = `
<div class="kpi-grid">
  <div class="kpi hero"><span class="kpi-lbl">Guardado nas metas</span>
    <span class="kpi-val">${fmt(TOT)}</span>
    <span class="kpi-sub">${Math.round(TOT/ALVO*100)}% de ${fmt0(ALVO)} · 4 metas</span>
    <a class="kpi-link" href="03-patrimonio.html">Ver os ativos que alimentam →</a></div>
  <div class="kpi"><span class="kpi-lbl">Concluídas</span><span class="kpi-val up">1</span>
    <span class="kpi-sub">Notebook novo</span></div>
  <div class="kpi"><span class="kpi-lbl">Aportado em agosto</span><span class="kpi-val">${fmt(1200)}</span>
    <span class="kpi-sub">1 aporte, via ativo vinculado</span></div>
</div>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
  <span class="form-hint">Ordenadas por prazo</span>
  <span style="flex:1 1 auto"></span>
  <button class="btn btn-primary" data-open="modal-meta">+ Nova meta</button>
</div>

<div class="gridscroll"><div class="metas">${METAS.map(card).join('')}</div></div>`;

const vazio = `
<div style="display:flex;margin-bottom:12px"><span style="flex:1 1 auto"></span>
  <button class="btn btn-primary" data-open="modal-meta">+ Nova meta</button></div>
<div class="card">
  <div class="empty">
    <div class="glyph">◎</div>
    <h3>Nenhuma meta cadastrada</h3>
    <p>Meta é um alvo com prazo. Um ativo do Patrimônio pode ser vinculado a uma meta —
       aí todo aporte naquele ativo credita a meta sozinho, sem lançamento duplicado.</p>
    <button class="btn btn-primary" data-open="modal-meta">Criar a primeira meta</button>
  </div>
</div>`;

const carregando = `${Radar.skKpis(3)}
<div class="metas">${[0,1,2,3].map(() => `
  <div class="meta"><span class="sk sk-line" style="width:35%"></span>
    <span class="sk sk-line" style="width:70%;height:16px"></span>
    <span class="sk sk-line" style="width:100%;height:20px;margin-top:14px"></span>
    <span class="sk sk-line" style="width:100%;height:8px"></span>
    <span class="sk sk-line" style="width:60%"></span></div>`).join('')}</div>`;

const modals = `
<div class="modal" id="modal-meta" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Editar meta</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Nome</label><input class="form-input" value="Reserva de emergência"></div></div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Tipo</label>
          <select class="form-input"><option>Reserva</option><option>Viagem</option><option>Compra</option><option>Longo prazo</option></select></div>
        <div class="form-col"><label class="form-label">Prazo</label><input type="month" class="form-input" value="2027-12"></div>
      </div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Valor alvo</label><input type="number" class="form-input" value="30000"></div>
        <div class="form-col"><label class="form-label">Valor atual</label><input type="number" class="form-input" value="15000">
          <span class="form-hint">Aporte de ativo vinculado soma aqui sozinho.</span></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-danger">Excluir</button><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar</button></div>
  </div>
</div>

<div class="modal" id="modal-aporte" hidden>
  <div class="modal-box" style="width:min(430px,94vw)">
    <div class="modal-head"><h2>Aporte · Reserva de emergência</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-col"><label class="form-label">Valor</label><input type="number" class="form-input" placeholder="0,00"></div>
        <div class="form-col"><label class="form-label">Data</label><input type="date" class="form-input" value="2026-08-19"></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Observação</label><input class="form-input" placeholder="opcional"></div></div>
    </div>
    <div class="modal-foot"><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar aporte</button></div>
  </div>
</div>`;

mount({ tab:'metas', title:'Metas',
  intro:"Alvos com prazo. <b>Use “+ Aporte” para registrar quanto guardou</b>; se a meta estiver ligada a um ativo do Patrimônio, o aporte lá credita aqui sozinho.", states:{dados, vazio, carregando}, modals });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/metas.js', [
  ['renderMetas', 'Ponto de entrada da aba', 'Tela inteira'],
  ['_renderMetasGrid', 'Um card por meta, com barra de progresso', 'Grade de cards'],
  ['meta concluída', 'Meta que atingiu o alvo', 'Card "Notebook novo", em verde'],
  ['btn-nova-meta', 'Abre o modal em branco', 'Botão "+ Nova meta"'],
  ['_openMetaModal', 'Abre o modal preenchido', 'Botão "Editar" do card'],
  ['meta-nome / tipo / alvo / atual / prazo', 'Campos do formulário', 'Modal "Editar meta"'],
  ['_salvarMeta', 'Grava a meta', 'Botão "Salvar"'],
  ['modal-aporte', 'Registra um aporte na meta', 'Botão "+ Aporte"'],
  ['aporte-valor / data / obs', 'Campos do aporte', 'Modal "Aporte"'],
  ['_salvarAporte', 'Soma o aporte ao valor atual', 'Botão "Salvar aporte"'],
  ['linkedGoalId (js/db.js:390)', 'Aporte em ativo vinculado credita a meta', 'Rodapé dos cards com ativo + KPI "Aportado em agosto"'],
  ['excluir (confirm nativo)', 'Remove a meta', 'Botão ✕ do card'],
  ['NOVO · Ver os ativos', 'Liga Metas e Patrimônio, o par do grupo "Longo prazo"', 'Link do KPI principal'],
]));
</script>
</body>
</html>

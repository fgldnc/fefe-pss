<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Orçamento</title>
<link rel="stylesheet" href="_radar.css">
<style>
  .orc{display:grid;grid-template-columns:1.4fr 130px 1.6fr 66px;gap:12px;align-items:center;
    padding:11px 0;border-top:1px solid var(--border)}
  .orc:first-of-type{border-top:0}
  .orc .cat{display:flex;align-items:center;gap:8px;min-width:0}
  .orc .cat b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orc .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .orc .gasto{font-size:.74rem;color:var(--text-3);font-family:var(--font-num)}
  .orc .pct{text-align:right;font-family:var(--font-num);font-size:.82rem}
  .orc input{text-align:right}
  .estourou{border-left:3px solid var(--gasto);margin-left:-15px;padding-left:12px}
  @media(max-width:760px){.orc{grid-template-columns:1fr 110px;gap:8px}
    .orc .barwrap{grid-column:1/-1}.orc .pct{grid-column:1/-1;text-align:left}}
  .mobile .orc{grid-template-columns:1fr 110px;gap:8px}
  .mobile .orc .barwrap,.mobile .orc .pct{grid-column:1/-1}
  .mobile .orc .pct{text-align:left}
</style>
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, fmt0, skTable } = Radar;

/* nome, gasto, limite, cor */
const CAT = [
  ['Moradia',      1487.00, 1400, '--c1'],
  ['Alimentação',   747.30, 1200, '--c2'],
  ['Transporte',    412.55,  600, '--c3'],
  ['Educação',      267.30,  400, '--c4'],
  ['Saúde',         192.40, null, '--c5'],
  ['Assinaturas',   128.90,  150, '--c6'],
  ['Compras',       412.90,  500, '--c1'],
  ['Lazer',           0.00,  300, '--c2'],
];
const G = CAT.reduce((s,c)=>s+c[1],0);
const L = CAT.reduce((s,c)=>s+(c[2]||0),0);
const semLimite = CAT.filter(c=>c[2]===null).reduce((s,c)=>s+c[1],0);

const row = ([n,g,l,cor]) => {
  if (l === null) return `
    <div class="orc">
      <div class="cat"><span class="swatch" style="background:var(${cor})"></span>
        <div><b>${n}</b><div class="gasto">${fmt(g)} gastos</div></div></div>
      <input class="form-input" type="number" placeholder="sem limite">
      <div class="barwrap"><div class="bar"><i style="width:0"></i></div>
        <div class="gasto" style="margin-top:4px"><span class="mark-inferido">sem limite definido</span></div></div>
      <span class="pct" style="color:var(--text-3)">—</span>
    </div>`;
  const p = g / l * 100;
  const cls = p >= 100 ? 'over' : p >= 80 ? 'warn' : 'ok';
  return `
    <div class="orc ${p >= 100 ? 'estourou' : ''}">
      <div class="cat"><span class="swatch" style="background:var(${cor})"></span>
        <div><b>${n}</b><div class="gasto">${fmt(g)} gastos</div></div></div>
      <input class="form-input" type="number" value="${l}">
      <div class="barwrap"><div class="bar ${cls}"><i style="width:${Math.min(p,100)}%"></i></div>
        <div class="gasto" style="margin-top:4px">${p >= 100
          ? `<span class="down">estourou ${fmt(g-l)}</span>`
          : `restam ${fmt(l-g)}`}</div></div>
      <span class="pct ${p>=100?'down':p>=80?'warn':''}">${Math.round(p)}%</span>
    </div>`;
};

const dados = `
<div class="kpi-grid">
  <div class="kpi"><span class="kpi-lbl">Limite total</span><span class="kpi-val">${fmt(L)}</span>
    <span class="kpi-sub">7 de 8 categorias com limite</span></div>
  <div class="kpi hero"><span class="kpi-lbl">Consumido</span>
    <span class="kpi-val">${fmt(G)}</span>
    <span class="kpi-sub">${Math.round(G/L*100)}% do limite · faltam 12 dias</span>
    <a class="kpi-link" href="03-gastos.html">Ver os lançamentos →</a></div>
  <div class="kpi"><span class="kpi-lbl">Estourado</span><span class="kpi-val down">${fmt(87)}</span>
    <span class="kpi-sub">1 categoria acima do limite</span></div>
</div>

<div class="card grow">
  <div class="card-head"><span class="card-ttl">Limites de agosto 2026</span><span class="sp"></span>    <button class="btn btn-primary btn-sm">Salvar limites</button></div>
  <p class="card-sub">Digite quanto pretende gastar em cada categoria e clique em Salvar. Deixar em branco é válido — só significa que aquela categoria não tem teto.</p>
  ${CAT.map(row).join('')}
  <div style="display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;
              border-top:1px solid var(--border);flex-wrap:wrap">
    <span class="mark-inferido">${fmt(semLimite)} em categoria sem limite definido</span>
    <span class="sp" style="flex:1 1 auto"></span>
    <button class="btn btn-primary">Salvar limites</button>
  </div>
  <p class="form-hint" style="margin-top:10px">Faixas: <b>≥ 100%</b> estourado, <b>≥ 80%</b> atenção, abaixo disso ok
    (<code>js/orcamento.js:37</code>). Categoria de investimento fica fora — mesma regra
    <code>getInvestCatIds()</code> do Dashboard e da aba Gastos.</p>
</div>`;

const vazio = `
<div class="card">
  <div class="empty">
    <div class="glyph">▦</div>
    <h3>Nenhum limite definido para agosto</h3>
    <p>Sem limite, o Dashboard não consegue avisar quando uma categoria está perto de estourar —
       o alerta dispara a partir de 90% do limite, e não há limite para comparar.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary">Definir limites</button>
          </div>
  </div>
</div>`;

const carregando = `${Radar.skKpis(3)}${skTable(8, 4)}`;

mount({ tab:'orcamento', title:'Orçamento',
  intro:"Quanto você pretende gastar em cada categoria. <b>Digite o limite na caixinha e salve</b> — a barra ao lado mostra quanto disso já foi usado neste mês.", states:{dados, vazio, carregando} });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/orcamento.js', [
  ['renderOrcamento', 'Ponto de entrada da aba', 'Tela inteira'],
  ['orcamento-editor', 'Uma linha editável por categoria do mês', 'Card "Limites de agosto 2026"'],
  ['input de limite', 'Campo numérico por categoria', 'Coluna do meio de cada linha'],
  ['faixas de status (:37)', '≥100% over · ≥80% warn · resto ok', 'Cor da barra e do percentual'],
  ['btn-salvar-orcamento', 'Grava o mapa de limites do mês', 'Botão "Salvar limites" (topo e rodapé)'],
  ['consumo por categoria', 'Quanto já foi gasto contra o limite', 'Valor abaixo do nome + barra'],
  ['categoria sem limite', 'Categoria com gasto e sem limite definido', 'Linha "Saúde", em âmbar'],
  ['getInvestCatIds()', 'Investimento fora do orçamento', 'Nota no rodapé do card'],  ['NOVO · Ver os lançamentos', 'Atalho aprovado na etapa 2', 'Link no KPI "Consumido"'],
]));
</script>
</body>
</html>

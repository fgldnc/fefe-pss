<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Receitas</title>
<link rel="stylesheet" href="_radar.css">
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, skTable } = Radar;

const R = [
  ['05/08','Salário · GBA Advogados','salario',5200.00],
  ['05/08','Vale-alimentação','beneficio',780.00],
  ['12/08','Freela · landing page','extra',498.00],
];
const TOTAL = R.reduce((s,x)=>s+x[3],0);
const TIPO = { salario:'salário', beneficio:'benefício', extra:'extra' };

const dados = `
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
  <span class="form-hint">3 receitas em agosto de 2026</span>
  <span style="flex:1 1 auto"></span>
  <button class="btn btn-ghost" title="Traz as receitas de julho para agosto">Copiar do mês anterior</button>
  <button class="btn btn-primary" data-open="modal-receita">+ Nova receita</button>
</div>

<div class="kpi-grid">
  <div class="kpi hero"><span class="kpi-lbl">Total de agosto</span>
    <span class="kpi-val up">${fmt(TOTAL)}</span>
    <span class="kpi-sub">+4,8% vs. julho</span>
    <a class="kpi-link" href="03-dashboard.html">Ver no resumo do mês →</a></div>
  <div class="kpi"><span class="kpi-lbl">Fixa</span><span class="kpi-val">${fmt(5980)}</span>
    <span class="kpi-sub">salário + benefício</span></div>
  <div class="kpi"><span class="kpi-lbl">Variável</span><span class="kpi-val">${fmt(498)}</span>
    <span class="kpi-sub">1 lançamento extra</span></div>
</div>

<div class="card grow">
  <div class="card-head"><span class="card-ttl">Receitas de agosto</span></div>
  <p class="card-sub">Se o seu salário se repete todo mês, use “Copiar do mês anterior” em vez de digitar tudo de novo.</p>
  <div class="table-wrapper">
    <table class="data">
      <thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>${R.map(x => `
        <tr><td class="mono">${x[0]}</td><td>${x[1]}</td>
          <td><span class="tag">${TIPO[x[2]]}</span></td>
          <td class="num up">${fmt(x[3])}</td>
          <td><div class="row-act">
            <button class="icon-btn" title="Editar" data-open="modal-receita">✎</button>
            <button class="icon-btn" title="Excluir">✕</button></div></td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num up">${fmt(TOTAL)}</td><td></td></tr></tfoot>
    </table>
  </div>
  <p class="form-hint" style="margin-top:10px">A competência da receita segue três critérios, nesta ordem:
    campo <code>month</code>, senão <code>competenceMonth</code>, senão o mês da data (<code>js/db.js:197</code>).</p>
</div>`;

const vazio = `
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
  <span style="flex:1 1 auto"></span>
  <button class="btn btn-ghost">Copiar do mês anterior</button>
  <button class="btn btn-primary" data-open="modal-receita">+ Nova receita</button>
</div>
<div class="card">
  <div class="empty">
    <div class="glyph">↑</div>
    <h3>Nenhuma receita em agosto de 2026</h3>
    <p>Sem receita cadastrada, o KPI "Livre para gastar" do resumo do mês fica negativo —
       ele é receita menos comprometido, e não há receita para subtrair.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" data-open="modal-receita">Cadastrar receita</button>
      <button class="btn btn-ghost">Copiar as 3 de julho</button>
    </div>
  </div>
</div>`;

const carregando = `
<div style="display:flex;gap:8px;margin-bottom:12px">
  <span style="flex:1 1 auto"></span>
  <span class="sk sk-line" style="width:170px;height:32px"></span>
  <span class="sk sk-line" style="width:120px;height:32px"></span>
</div>
${Radar.skKpis(3)}
${skTable(3, 5)}`;

const modals = `
<div class="modal" id="modal-receita" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Editar receita</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-col"><label class="form-label">Data</label><input type="date" class="form-input" value="2026-08-05"></div>
        <div class="form-col"><label class="form-label">Valor</label><input type="number" class="form-input" value="5200.00"></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Descrição</label><input class="form-input" value="Salário · GBA Advogados"></div></div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Tipo</label>
        <select class="form-input"><option>Salário</option><option>Benefício</option><option>Extra</option></select></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-danger">Excluir</button><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar</button></div>
  </div>
</div>`;

mount({ tab:'receitas', title:'Receitas',
  intro:"O que entrou no mês. <b>Cadastre pelo menos o salário:</b> sem receita lançada, o Radar não consegue calcular quanto sobra e o número da tela inicial fica negativo.", states:{dados, vazio, carregando}, modals });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/receitas.js', [
  ['renderReceitas', 'Ponto de entrada da aba', 'Tela inteira'],
  ['_renderReceitasTable', 'Tabela do mês + total no rodapé', 'Card "Receitas de agosto"'],
  ['receitas-total', 'Soma do mês', 'Rodapé da tabela e KPI "Total de agosto"'],
  ['btn-nova-receita', 'Abre o modal em branco', 'Botão "+ Nova receita"'],
  ['btn-copiar-receitas', 'Copia as receitas do mês anterior', 'Botão "Copiar do mês anterior"'],
  ['_openReceitaModal (edição)', 'Abre o modal preenchido', 'Botão ✎ de cada linha'],
  ['btn-salvar-receita', 'Grava a receita', 'Botão "Salvar" do modal'],
  ['receita-data / desc / valor / tipo', 'Campos do formulário', 'Modal'],
  ['excluir (confirm nativo)', 'Remove a receita', 'Botão ✕ e "Excluir" no modal'],
  ['competência (js/db.js:197)', 'month → competenceMonth → data', 'Nota abaixo da tabela'],
]));
</script>
</body>
</html>

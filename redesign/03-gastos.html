<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Gastos</title>
<link rel="stylesheet" href="_radar.css">
<style>
  .filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .filtros .busca{flex:1 1 220px;min-width:150px}
  .adv{background:var(--surface-raised);border:1px solid var(--border);border-radius:11px;
    padding:12px 13px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .adv .checks{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--text-2)}
  .adv label.ck{display:flex;align-items:center;gap:6px;cursor:pointer}
  .desc-cell{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .obs{font-size:.72rem;color:var(--text-3);display:block}
</style>
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, fmt0, skTable } = Radar;

const LINHAS = [
  ['04/08','Supermercado Zona Sul','Alimentação','debito',412.90,'',''],
  ['05/08','Aluguel agosto','Moradia','debito',1487.00,'',''],
  ['07/08','PG *LOJA 4471','','credito',89.00,'','sem categoria'],
  ['09/08','Uber · centro','Transporte','credito',37.40,'',''],
  ['11/08','Farmácia São João','Saúde','credito',63.40,'','Receita da Dra. Lima'],
  ['12/08','Tesouro Selic 2029','Investimentos','debito',1200.00,'','ativo: Tesouro Selic'],
  ['15/08','SENAC · curso','Educação','credito',267.30,'3/6',''],
  ['15/08','Notebook Dell','Compras','credito',412.90,'7/12',''],
  ['18/08','Netflix','Assinaturas','credito',59.90,'',''],
  ['20/08','Posto Ipiranga','Transporte','credito',180.00,'',''],
];
const PROJETADAS = [
  ['15/09','SENAC · curso','Educação','credito',267.30,'4/6','projetada'],
  ['15/09','Notebook Dell','Compras','credito',412.90,'8/12','projetada'],
];
const TOTAL = LINHAS.reduce((s,l)=>s+l[4],0);

const tipoTag = t => t === 'debito'
  ? '<span class="tag">débito</span>'
  : '<span class="tag">crédito</span>';

const linha = (l, proj) => `
  <tr class="${proj ? 'row-atencao' : ''}">
    <td class="mono" style="white-space:nowrap">${l[0]}</td>
    <td><div class="desc-cell">${l[1]}
      ${l[5] ? `<span class="tag">${l[5]}</span>` : ''}
      ${proj ? '<span class="tag tag-projetada">projetada</span>' : ''}</div>
      ${l[6] && l[6] !== 'sem categoria' ? `<span class="obs">${l[6]}</span>` : ''}</td>
    <td>${l[2]
      ? l[2]
      : '<span class="mark-inferido">sem categoria</span>'}</td>
    <td>${tipoTag(l[3])}</td>
    <td class="num down">${fmt(l[4])}</td>
    <td><div class="row-act">
      ${proj ? '<button class="icon-btn" title="Confirmar: esta parcela deixa de ser estimativa">✓</button>' : ''}
      <button class="icon-btn" title="Editar" data-open="modal-gasto">✎</button>
      <button class="icon-btn" title="Excluir">✕</button></div></td>
  </tr>`;

/* ═══════════ COM DADOS ═══════════ */
const dados = `
<div class="filtros">
  <input class="form-input busca" placeholder="Buscar na descrição…">
  <select class="form-input" style="width:auto"><option>Todas as categorias</option><option>Sem categoria</option><option>Moradia</option><option>Alimentação</option></select>
  <select class="form-input" style="width:auto"><option>Débito e crédito</option><option>Só débito</option><option>Só crédito</option></select>
  <button class="btn btn-ghost" id="btn-adv">Filtros avançados ▾</button>
  <button class="btn btn-ghost">Limpar</button>
  <span class="sp" style="flex:1 1 auto"></span>
  <button class="btn btn-ghost" data-open="modal-pdf-drop">Importar fatura PDF</button>
  <button class="btn btn-primary" data-open="modal-gasto">+ Novo gasto</button>
</div>

<div class="adv" id="adv" hidden>
  <div class="form-col"><label class="form-label">Data inicial</label><input type="date" class="form-input" value="2026-08-01"></div>
  <div class="form-col"><label class="form-label">Data final</label><input type="date" class="form-input" value="2026-08-31"></div>
  <div class="form-col"><label class="form-label">Valor mínimo</label><input type="number" class="form-input" placeholder="0,00"></div>
  <div class="form-col"><label class="form-label">Valor máximo</label><input type="number" class="form-input" placeholder="0,00"></div>
  <div class="checks">
    <label class="ck"><input type="checkbox"> Só compras parceladas</label>
    <label class="ck"><input type="checkbox"> Só parcelas projetadas <span class="mark-inferido">ainda não conferidas</span></label>
  </div>
</div>

<div class="card grow">
  <div class="card-head"><span class="card-ttl">Agosto 2026 · 10 lançamentos</span><span class="sp"></span>
    <span class="form-hint">◇ 1 sem categoria · ◇ 2 parcelas projetadas</span></div>
  <p class="card-sub">Clique no ✎ para corrigir um lançamento. O ✓ nas linhas em âmbar confirma que aquela parcela realmente caiu.</p>
  <div class="table-wrapper">
    <table class="data">
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>
        ${LINHAS.map(l => linha(l, false)).join('')}
        ${PROJETADAS.map(l => linha(l, true)).join('')}
      </tbody>
      <tfoot><tr><td colspan="4">Total do mês</td><td class="num down">${fmt(TOTAL)}</td><td></td></tr></tfoot>
    </table>
  </div>
  <p class="form-hint" style="margin-top:10px">Investimento (${fmt(1200)}) entra na tabela mas fica fora do KPI de despesas —
    mesma regra de <code>getInvestCatIds()</code> usada no Dashboard e no Orçamento.</p>
</div>`;

/* ═══════════ VAZIO ═══════════ */
const vazio = `
<div class="filtros">
  <input class="form-input busca" placeholder="Buscar na descrição…" disabled>
  <span class="sp" style="flex:1 1 auto"></span>
  <button class="btn btn-ghost" data-open="modal-pdf-drop">Importar fatura PDF</button>
  <button class="btn btn-primary" data-open="modal-gasto">+ Novo gasto</button>
</div>
<div class="card">
  <div class="empty">
    <div class="glyph">▤</div>
    <h3>Nenhum gasto em agosto de 2026</h3>
    <p>Importe a fatura do cartão, traga um extrato ou lance à mão. O total do mês, a rosca do dashboard e o fluxo de caixa saem daqui.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" data-open="modal-pdf-drop">Importar fatura PDF</button>
      <a class="btn btn-ghost" href="03-extratos.html">Importar extrato</a>
      <button class="btn btn-ghost" data-open="modal-gasto">Lançar à mão</button>
    </div>
  </div>
</div>`;

/* ═══════════ CARREGANDO ═══════════ */
const carregando = `
<div class="filtros">
  <span class="sk sk-line" style="width:240px;height:32px"></span>
  <span class="sk sk-line" style="width:150px;height:32px"></span>
  <span class="sp" style="flex:1 1 auto"></span>
  <span class="sk sk-line" style="width:120px;height:32px"></span>
</div>
${skTable(9, 6)}`;

/* ═══════════ MODAIS ═══════════ */
const modals = `
<!-- ─── importação de fatura: passo 1, escolher o arquivo ─── -->
<div class="modal" id="modal-pdf-drop" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Importar fatura de cartão</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="drop over">
        <p style="font-size:1.6rem;margin-bottom:6px">⇣</p>
        <p><b>Arraste a fatura em PDF</b> ou clique para escolher</p>
        <p class="form-hint" style="margin-top:6px">Itaú, Nubank, Bradesco e genérico · até 20 MB ·
          lido só no seu navegador, nada sobe para servidor nenhum</p>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:14px" hidden id="proc">
        <span class="sk" style="width:16px;height:16px;border-radius:50%"></span>
        <span class="form-hint">Lendo o PDF…</span>
      </div>
    </div>
    <div class="modal-foot"><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" data-close data-open="modal-pdf">Ver a revisão →</button></div>
  </div>
</div>

<!-- ─── lançamento manual ─── -->
<div class="modal" id="modal-gasto" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Editar gasto</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-col"><label class="form-label">Data</label><input type="date" class="form-input" value="2026-08-15"></div>
        <div class="form-col"><label class="form-label">Valor</label><input type="number" class="form-input" value="267.30"></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Descrição</label><input class="form-input" value="SENAC · curso"></div></div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Categoria</label>
          <select class="form-input"><option>Educação</option><option>Investimentos</option></select></div>
        <div class="form-col"><label class="form-label">Tipo</label>
          <select class="form-input"><option>Crédito</option><option>Débito</option></select></div>
      </div>
      <div class="form-row" id="ativo-row" hidden>
        <div class="form-col" style="flex:1 1 100%"><label class="form-label">Ativo vinculado</label>
          <select class="form-input"><option>Tesouro Selic 2029</option></select>
          <span class="form-hint">Aparece só quando a categoria é de investimento.</span></div>
      </div>
      <div class="form-row">
        <div class="form-col"><label class="form-label">Competência</label>
          <input type="month" class="form-input" value="2026-08">
          <span class="form-hint">Em qual mês este gasto conta no dashboard.</span></div>
        <div class="form-col"><label class="form-label">Parcela</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" class="form-input" value="3" style="width:64px">
            <span class="form-hint">de</span>
            <input type="number" class="form-input" value="6" style="width:64px"></div>
          <span class="form-hint">Salvar projeta as parcelas seguintes.</span></div>
      </div>
      <div class="form-row"><div class="form-col" style="flex:1 1 100%">
        <label class="form-label">Observação</label><textarea class="form-input" rows="2"></textarea></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-danger">Excluir</button><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary">Salvar</button></div>
  </div>
</div>

<!-- ─── importação de fatura em PDF ─── -->
<div class="modal modal-import" id="modal-pdf" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Importar fatura de cartão</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">

      <div class="form-row" style="align-items:flex-end;gap:14px">
        <div class="form-col" style="flex:0 0 190px">
          <label class="form-label">Mês de competência</label>
          <input type="month" class="form-input field-inferido" value="2026-07">
          <span class="mark-inferido">deduzido do vencimento 10/08 · confirme</span>
        </div>
        <div class="form-col" style="flex:1 1 200px">
          <span class="form-hint">Fatura que vence em agosto é a fatura de julho.
            O deslocamento fica em <code>fluxo_billing_offset</code> (padrão −1).</span>
        </div>
      </div>

      <div class="import-summary-bar">
        <span><b>14</b> lançamentos lidos · Itaú</span>
        <span><b>1</b> sem categoria</span>
        <span><b>1</b> parcela reconciliada</span>
        <span><b>1</b> duplicata pulada</span>
        <span class="sp" style="flex:1 1 auto"></span>
        <label class="chip-filter"><input type="checkbox"> ver só o que precisa de atenção</label>
      </div>

      <div class="table-wrapper">
        <table class="data">
          <thead><tr><th><input type="checkbox" checked></th><th>Data</th><th>Descrição</th>
            <th>Categoria</th><th class="num">Valor</th><th>Parcela</th></tr></thead>
          <tbody>
            <tr><td><input type="checkbox" checked></td><td class="mono">03/07</td>
              <td>DROGARIA SP</td><td><select class="field"><option>Saúde</option></select></td>
              <td class="num down">${fmt(63.40)}</td><td>—</td></tr>

            <tr class="row-atencao"><td><input type="checkbox" checked></td>
              <td class="mono">07/07 <span class="mark-inferido">ano</span></td>
              <td>PG *LOJA 4471</td>
              <td><select class="field field-inferido"><option>Sem categoria</option></select>
                  <span class="mark-inferido">inferido</span></td>
              <td class="num down">${fmt(89.00)}</td><td>—</td></tr>

            <tr><td><input type="checkbox" checked></td><td class="mono">11/07</td>
              <td>SENAC SAO PAULO</td>
              <td><select class="field field-editado"><option>Educação</option></select></td>
              <td class="num down">${fmt(267.30)}</td><td>3/6</td></tr>

            <tr><td><input type="checkbox" checked></td><td class="mono">15/07</td>
              <td>DELL COMPUTADORES <span class="tag tag-ok">reconcilia projeção</span></td>
              <td><select class="field"><option>Compras</option></select></td>
              <td class="num down">${fmt(412.90)}</td><td>7/12</td></tr>

            <tr style="opacity:.55"><td><input type="checkbox"></td><td class="mono">18/07</td>
              <td>NETFLIX.COM <span class="tag tag-dup">duplicata</span></td>
              <td><select class="field" disabled><option>Assinaturas</option></select></td>
              <td class="num">${fmt(59.90)}</td><td>—</td></tr>
          </tbody>
        </table>
      </div>
      <p class="form-hint" style="margin-top:9px">
        Duplicata: já existe em julho, ${fmt(59.90)}, mesma descrição. Parcela projetada não é duplicata —
        a linha do Dell atualiza a projeção no lugar, com valor e data reais.</p>
    </div>
    <div class="modal-foot">
      <span class="form-hint">PDF até 20 MB, lido só no seu navegador.</span>
      <span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-atencao">Salvar assim mesmo · 1 sem categoria</button>
    </div>
  </div>
</div>`;

function onRender(estado, root) {
  const adv = root.querySelector('#adv'), btn = root.querySelector('#btn-adv');
  if (btn) btn.onclick = () => adv.hidden = !adv.hidden;
}

mount({ tab:'gastos', title:'Gastos',
  intro:"Tudo que saiu no mês, numa tabela só. <b>Se a fatura do cartão ainda não entrou, comece por “Importar fatura PDF”</b> — depois use os filtros para achar um lançamento específico.", states:{dados, vazio, carregando}, modals, onRender });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/gastos.js + js/pdf-import.js', [
  ['renderGastos', 'Ponto de entrada da aba', 'Tela inteira'],
  ['_renderTable', 'Tabela do mês + total no rodapé', 'Card "Agosto 2026"'],
  ['_tipoTag', 'Marca débito / crédito', 'Coluna Tipo'],
  ['_populateCategorySelects', 'Preenche os selects de categoria', 'Filtro e modal'],
  ['filter-busca', 'Busca na descrição', 'Campo de busca'],
  ['filter-categoria', 'Filtro por categoria, com sentinela "Sem categoria"', '2º select'],
  ['filter-tipo-gasto', 'Filtro débito / crédito', '3º select'],
  ['btn-filtros-avancados', 'Abre o painel avançado', 'Botão "Filtros avançados"'],
  ['filter-data-inicio / fim', 'Recorte por período', 'Painel avançado'],
  ['filter-valor-min / max', 'Recorte por valor', 'Painel avançado'],
  ['filter-apenas-parcelas', 'Só compras parceladas', 'Painel avançado'],
  ['filter-apenas-projetadas', 'Só parcelas ainda não conferidas', 'Painel avançado (destino do link do Dashboard)'],
  ['btn-limpar-filtros', 'Zera todos os filtros', 'Botão "Limpar"'],
  ['btn-novo-gasto', 'Abre o modal em branco', 'Botão "+ Novo gasto"'],
  ['_openGastoModal', 'Abre o modal preenchido', 'Botão ✎ de cada linha'],
  ['_salvarGasto', 'Grava o lançamento', 'Botão "Salvar" do modal'],
  ['_projetarParcelas', 'Cria as parcelas seguintes como projeção', 'Campo Parcela + nota no modal'],
  ['_toggleAtivoRow', 'Mostra "Ativo vinculado" quando a categoria é de investimento', 'Linha oculta do modal'],
  ['_isInvestCat', 'Regra de categoria de investimento', 'Nota no rodapé da tabela'],
  ['_confirmarProjecao', 'Botão ✓ tira a parcela do estado projetado', 'Botão ✓ nas linhas projetadas'],
  ['excluir (confirm nativo)', 'Remove o lançamento', 'Botão ✕ de cada linha'],
  ['btn-import-pdf', 'Abre a importação de fatura', 'Botão "Importar fatura PDF"'],
  ['competenciaDaFatura', 'Competência = vencimento + offset; marca o que foi deduzido', 'Campo âmbar no topo do modal'],
  ['_acharParcela', 'Distingue duplicata de projeção a reconciliar', 'Linhas Netflix e Dell'],
  ['detectDuplicates', 'Duplicata com a evidência do que bateu', 'Nota abaixo da tabela'],
  ['_recomputeAtencao', 'Recontagem de pendências lendo o DOM', 'Barra de contadores'],
  ['filtro "só atenção"', 'Esconde as linhas sem pendência', 'Checkbox na barra'],
  ['btn-confirmar-pdf', 'Nunca bloqueia o salvamento', '"Salvar assim mesmo · 1 sem categoria"'],
  ['PDF_MAX_BYTES', 'Limite de 20 MB', 'Rodapé do modal'],
  ['drop zone / passo 1', 'Arrastar ou escolher o PDF, com o limite e o aviso de processamento local', 'Modal "Importar fatura de cartão"'],
]));
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Extratos</title>
<link rel="stylesheet" href="_radar.css">
<style>
  .lote{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
  .lote:first-of-type{border-top:0}
  .lote .id{flex:1 1 200px;min-width:0}
  .lote .id b{font-weight:500}
  .lote .meta{font-size:.72rem;color:var(--text-3)}
  .batch-stat{font-size:.74rem;font-family:var(--font-num);color:var(--text-2);white-space:nowrap}
  .batch-stat-out{color:var(--gasto)}
  .batch-stat-in{color:var(--receita)}
</style>
</head>
<body>
<script src="_shell.js"></script>
<script>
const { mount, checklist, fmt, fmt0, skTable } = Radar;

const LOTES = [
  ['extrato-itau-ago.ofx','Itaú','OFX','02/09/2026 09:14', 38, 7420.00, 3218.55],
  ['nubank-2026-08.csv','Nubank','CSV','02/09/2026 09:02', 21, 0, 1894.20],
  ['bradesco-julho.pdf','Bradesco','PDF','04/08/2026 20:31', 44, 6980.00, 3105.10],
];

const TX = [
  ['04/08','PIX RECEBIDO CLIENTE X','entrada','Receita', 1200.00, ''],
  ['05/08','SALARIO GBA ADVOGADOS','entrada','Receita', 5200.00, ''],
  ['05/08','ALUGUEL AGOSTO','saida','Moradia', 1487.00, ''],
  ['07/08','PG *LOJA 4471','saida','', 89.00, 'sem-cat'],
  ['09/08','UBER   *TRIP','saida','Transporte', 37.40, ''],
  ['12/08','TED TESOURO DIRETO','saida','Investimentos', 1200.00, ''],
  ['18/08','NETFLIX.COM','saida','Assinaturas', 59.90, ''],
];

const dados = `
<div class="kpi-grid">
  <div class="kpi hero"><span class="kpi-lbl">Importado em agosto</span>
    <span class="kpi-val">59 lançamentos</span>
    <span class="kpi-sub">2 lotes · Itaú e Nubank</span>
    <a class="kpi-link" href="03-gastos.html">Ver junto dos gastos manuais →</a></div>
  <div class="kpi"><span class="kpi-lbl">Entradas</span><span class="kpi-val up">${fmt(7420)}</span></div>
  <div class="kpi"><span class="kpi-lbl">Saídas</span><span class="kpi-val down">${fmt(5112.75)}</span></div>
  <div class="kpi"><span class="kpi-lbl">Precisam de atenção</span><span class="kpi-val warn">3</span>
    <span class="kpi-sub">sem categoria</span></div>
</div>

<div class="card">
  <div class="card-head"><span class="card-ttl">Histórico de importações</span><span class="sp"></span>
    <button class="btn btn-primary btn-sm" data-open="modal-extrato">+ Importar extrato</button></div>
  <p class="card-sub">Cada linha é um arquivo que você trouxe. Se importou errado, “excluir lote” desfaz aquele arquivo inteiro de uma vez.</p>
  ${LOTES.map(l => `
    <div class="lote">
      <div class="id"><b>${l[0]}</b>
        <div class="meta">${l[1]} · ${l[2]} · importado em ${l[3]}</div></div>
      <span class="batch-stat">${l[4]} linhas</span>
      ${l[5] ? `<span class="batch-stat batch-stat-in">+${fmt0(l[5])}</span>` : ''}
      <span class="batch-stat batch-stat-out">−${fmt0(l[6])}</span>
      <button class="icon-btn" title="Excluir este lote inteiro">✕ excluir lote</button>
    </div>`).join('')}
  <p class="form-hint" style="margin-top:10px">Excluir o lote remove de uma vez todos os lançamentos que
    entraram por aquele arquivo — é o desfazer da importação.</p>
</div>

<div class="card grow">
  <div class="card-head"><span class="card-ttl">Lançamentos importados · agosto</span><span class="sp"></span>
    <select class="form-input" style="width:auto"><option>Todos os bancos</option><option>Itaú</option><option>Nubank</option><option>Bradesco</option></select>
    <select class="form-input" style="width:auto"><option>Entradas e saídas</option><option>Só entradas</option><option>Só saídas</option></select>
  </div>
  <p class="card-sub">As linhas em âmbar são as que o Radar não conseguiu classificar — clique no ✎ para escolher a categoria.</p>
  <div class="table-wrapper">
    <table class="data">
      <thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>${TX.map(t => `
        <tr class="${t[5] === 'sem-cat' ? 'row-atencao' : ''}">
          <td class="mono">${t[0]}</td>
          <td>${t[1]}</td>
          <td><span class="tag">${t[2] === 'entrada' ? 'entrada' : 'saída'}</span></td>
          <td>${t[3] ? t[3] : '<span class="mark-inferido">sem categoria</span>'}</td>
          <td class="num ${t[2] === 'entrada' ? 'up' : 'down'}">${fmt(t[4])}</td>
          <td><div class="row-act"><button class="icon-btn" title="Editar">✎</button></div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <p class="form-hint" style="margin-top:10px">Competência do lançamento de extrato é o mês da própria data
    (<code>js/db.js:154</code>) — diferente do gasto manual, que usa <code>competenceMonth</code>.</p>
</div>`;

const vazio = `
<div class="card">
  <div class="empty">
    <div class="glyph">⇣</div>
    <h3>Nenhum extrato importado</h3>
    <p>Traga o arquivo do banco em CSV, OFX ou PDF. O Radar lê no seu navegador, tenta classificar
       cada linha pelas suas regras, marca o que não conseguiu e só grava depois que você conferir.</p>
    <button class="btn btn-primary" data-open="modal-extrato">Importar extrato</button>
  </div>
</div>`;

const carregando = `${Radar.skKpis(4)}${skTable(3,4)}${skTable(7,6)}`;

const modals = `
<!-- ─── passo 1: arquivo ─── -->
<div class="modal" id="modal-extrato" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Importar extrato</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="drop">
        <p style="font-size:1.6rem;margin-bottom:6px">⇣</p>
        <p><b>Arraste o extrato</b> ou clique para escolher</p>
        <p class="form-hint" style="margin-top:6px">OFX, CSV ou PDF — máx. 20 MB.
          Processado apenas no seu navegador.</p>
      </div>
      <p class="form-hint" style="margin-top:12px">O banco é deduzido do nome do arquivo quando dá
        (<code>_detectBankFromFile</code>); quando não dá, o parser genérico assume.</p>
    </div>
    <div class="modal-foot"><span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" data-open="modal-extrato-rev">Ver a revisão →</button></div>
  </div>
</div>

<!-- ─── passo 2: revisão ─── -->
<div class="modal modal-import" id="modal-extrato-rev" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Revisar · extrato-itau-ago.ofx</h2><span class="sp"></span>
      <button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">

      <div class="import-summary-bar">
        <span><b>38</b> linhas lidas · Itaú · OFX</span>
        <span class="batch-stat-in"><b>+${fmt0(7420)}</b> em 4 entradas</span>
        <span class="batch-stat-out"><b>−${fmt0(3218.55)}</b> em 34 saídas</span>
        <span><b>2</b> sem categoria</span>
        <span><b>1</b> duplicata</span>
        <span class="sp" style="flex:1 1 auto"></span>
        <label class="chip-filter"><input type="checkbox"> ver só o que precisa de atenção</label>
      </div>

      <p class="form-hint" style="margin-bottom:10px">Revise as transações.
        Duplicata aparece com o registro contra o qual bateu.</p>

      <div class="table-wrapper">
        <table class="data">
          <thead><tr><th><input type="checkbox" checked></th><th>Data</th><th>Descrição</th>
            <th>Tipo</th><th>Categoria</th><th class="num">Valor</th></tr></thead>
          <tbody>
            <tr><td><input type="checkbox" checked></td><td class="mono">05/08</td>
              <td>SALARIO GBA ADVOGADOS</td>
              <td><select class="field"><option>Entrada · salário</option></select></td>
              <td><select class="field"><option>Receita</option></select></td>
              <td class="num up">${fmt(5200)}</td></tr>

            <tr class="row-atencao"><td><input type="checkbox" checked></td>
              <td class="mono">07/08</td>
              <td>PG *LOJA 4471</td>
              <td><select class="field"><option>Saída</option></select></td>
              <td><select class="field field-inferido"><option>Sem categoria</option></select>
                  <span class="mark-inferido">inferido</span></td>
              <td class="num down">${fmt(89)}</td></tr>

            <tr><td><input type="checkbox" checked></td><td class="mono">09/08</td>
              <td>UBER   *TRIP</td>
              <td><select class="field"><option>Saída</option></select></td>
              <td><select class="field field-editado"><option>Transporte</option></select></td>
              <td class="num down">${fmt(37.40)}</td></tr>

            <tr><td><input type="checkbox" checked></td><td class="mono">12/08</td>
              <td>TED TESOURO DIRETO</td>
              <td><select class="field"><option>Saída</option></select></td>
              <td><select class="field"><option>Investimentos</option></select></td>
              <td class="num down">${fmt(1200)}</td></tr>

            <tr style="opacity:.55"><td><input type="checkbox"></td><td class="mono">18/08</td>
              <td>NETFLIX.COM <span class="tag tag-dup">duplicata</span></td>
              <td><select class="field" disabled><option>Saída</option></select></td>
              <td><select class="field" disabled><option>Assinaturas</option></select></td>
              <td class="num">${fmt(59.90)}</td></tr>
          </tbody>
        </table>
      </div>
      <p class="form-hint" style="margin-top:9px">
        Duplicata: bate com <b>NETFLIX.COM</b> de 18/08, ${fmt(59.90)}, saída — mesma data, mesmo tipo,
        mesmo valor ao centavo e os 40 primeiros caracteres da descrição.</p>
    </div>
    <div class="modal-foot">
      <span class="form-hint">37 de 38 selecionadas</span>
      <span class="sp"></span>
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-atencao">Salvar assim mesmo · 2 sem categoria</button>
    </div>
  </div>
</div>`;

mount({ tab:'extratos', title:'Extratos',
  intro:"A porta de entrada dos dados. <b>Arraste o arquivo do banco em “Importar extrato”</b> — o Radar lê no seu navegador, classifica o que reconhece e marca em âmbar só o que ficou em dúvida.", states:{dados, vazio, carregando}, modals });

document.getElementById('screen').insertAdjacentHTML('beforeend', checklist('js/extratos.js', [
  ['renderExtratos', 'Ponto de entrada da aba', 'Tela inteira'],
  ['_renderImportacoesList', 'Histórico de lotes com arquivo, banco, formato e data', 'Card "Histórico de importações"'],
  ['batch-stat-in / -out', 'Entradas e saídas somadas por lote', 'Números à direita de cada lote'],
  ['_deleteBatch', 'Apaga de uma vez todos os lançamentos daquele arquivo', 'Botão "✕ excluir lote"'],
  ['_renderExtratosTable', 'Tabela dos lançamentos importados do mês', 'Card "Lançamentos importados"'],
  ['_renderBancoFilters', 'Filtro por banco', '1º select do card'],
  ['filter-extrato-tipo', 'Filtro entrada / saída', '2º select do card'],
  ['btn-novo-extrato', 'Abre a importação', 'Botão "+ Importar extrato"'],
  ['initExtratoModal / _bindModalEvents', 'Liga o modal', 'Modal "Importar extrato"'],
  ['extrato-drop-zone / extrato-file-input', 'Arrastar ou escolher o arquivo', 'Passo 1'],
  ['_updateFormatHint', 'Aviso de formato e limite', '"OFX, CSV ou PDF — máx. 20 MB"'],
  ['extrato-processing', 'Estado de leitura do arquivo', 'Estado "Carregando" da tela'],
  ['_detectBankFromFile', 'Deduz o banco pelo nome do arquivo', 'Nota no passo 1'],
  ['_readFileAsText / parsers', 'CSV, OFX (SGML e XML) e PDF', 'Coluna Formato no histórico'],
  ['_showReview', 'Tabela de revisão editável', 'Modal "Revisar"'],
  ['extrato-batch-header', 'Barra de contadores do lote', 'import-summary-bar'],
  ['extrato-check-all', 'Selecionar todas', 'Checkbox no cabeçalho'],
  ['_classifyIncomeType', 'Deduz o tipo da entrada (salário etc.)', 'Coluna Tipo na revisão'],
  ['autoClassify / DEFAULT_RULES', 'Categoria automática por regex', 'Linhas já categorizadas, sem marca'],
  ['classificationOrigin', 'Silêncio quando a regra acertou; âmbar só no que foi deduzido', 'Só a linha PG *LOJA está em âmbar'],
  ['_motivoDuplicata', 'Diz contra o que a duplicata bateu', 'Nota abaixo da tabela'],
  ['dedupKey (centavo exato)', 'Data + tipo + valor em centavos + 40 caracteres', 'Texto da nota'],
  ['_recomputeAtencaoExtrato', 'Recontagem lendo o DOM', 'Barra de contadores'],
  ['filtro "só atenção"', 'Esconde linhas sem pendência', 'Checkbox na barra'],
  ['btn-confirmar-extrato', 'Nunca bloqueia o salvamento', '"Salvar assim mesmo · 2 sem categoria"'],
  ['_saveExtrato', 'Grava o lote e atualiza o state', 'Mesmo botão'],
  ['_resetModal', 'Zera o modal ao fechar', 'Botões "Cancelar" e ✕'],
  ['competência (js/db.js:154)', 'Extrato conta pelo mês da data', 'Nota no rodapé da tabela'],
]));
</script>
</body>
</html>
